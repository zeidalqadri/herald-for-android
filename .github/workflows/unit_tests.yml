name: Unit Tests

on:
  push:
    branches:
      - meshkit/fixes
  pull_request:
    branches:
      - develop
      - master
      - main

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile
        run: ./gradlew :herald:compileDebugSources --console=plain --no-daemon

      - name: Unit tests
        run: ./gradlew :herald:testDebugUnitTest --console=plain --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-results
          path: herald/build/reports/tests/testDebugUnitTest

      - name: Lint
        run: ./gradlew :herald:check --console=plain --no-daemon

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linting-results
          path: herald/build/reports/lint-results.html
